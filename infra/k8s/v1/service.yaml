apiVersion: v1
kind: Service
metadata:
  name: atena-api
  namespace: atena
  labels:
    app: atena-api
spec:
  type: ClusterIP
  selector:
    app: atena-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atena-api
  namespace: atena
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  rules:
    - host: api.atena.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atena-api
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atena-api
  namespace: atena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atena-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
