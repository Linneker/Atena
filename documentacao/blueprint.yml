  padroes_arquiteturais:
    - nome: "CQRS + Mediator"
      aplicacao: "Acme.Sistemas.Core e Acme.Sistemas.Services"
    - nome: "Pipeline Behavior"
      aplicacao: "IPipelineBehavior no Core e arquivos *Behavior.cs"
    - nome: "Repository Pattern"
      aplicacao: "Interfaces no Domain e implementações no Repository"
    - nome: "Outbox Pattern"
      aplicacao: "ProtocolIntegrationOutboxEntity e worker de dispatch"
    - nome: "Domain-Driven Design"
      aplicacao: "Entidades e agregados no Domain"
    - nome: "BPMN Workflow Engine"
      aplicacao: "Services, Domain e Repository"
    - nome: "Multi-tenancy"
      aplicacao: "Isolamento por tenant em entidades e repositórios"
    - nome: "Proxy HTTP por Reflexão"
      aplicacao: "HttpClientProxy em ExternalIntegration"
    - nome: "Migration Versionada"
      aplicacao: "MigrationRunner, IMigration e tabela __Migrations"
    - nome: "Feature Flags"
      aplicacao: "featureflags.json e FeatureFlagService"
    - nome: "Auditoria Funcional"
      aplicacao: "AuditLogEntity e middleware de auditoria"

  regras_validacao:
    - "Toda solução deve conter as pastas infra, src e test."
    - "Toda solução deve manter pastas virtuais e físicas."
    - "O projeto Services deve ser organizado por versão V{N}."
    - "Cada funcionalidade do Services pode conter Command, Query, Event e Services."
    - "Commands devem possuir Command, Handler, Behavior, Result e Validation."
    - "Queries devem possuir Query, Handler, Behavior, Result e Validation."
    - "Events devem possuir Notification, Handler, Behavior e Validation."
    - "Events não possuem retorno."
    - "O projeto Repository deve implementar interfaces definidas no Domain."
    - "O projeto Core deve concentrar contratos compartilhados e infraestrutura transversal."
    - "O projeto Api deve expor endpoints organizados por versão."
    - "O projeto Infrastructure deve centralizar integrações técnicas com banco, cache, mensageria e storage."

  convencoes_testes:
    descricao: >
      Padrão obrigatório de attributes para todo método [Fact]/[Theory]
      (incluindo casos com Skip) nos projetos UnitTest e IntegrationTest.
    attributes_obrigatorios:
      - nome: 'Trait("Solucao", <Camada>)'
        descricao: >
          Camada arquitetural do código sob teste. Vocabulário fechado:
          Api, Services, Core, Domain, Repository, Infrastructure,
          ExternalIntegration, Test (este último para meta-tests de
          convenções).
      - nome: 'Trait("Acao", <Unidade>)'
        descricao: >
          Nome curto da unidade-em-teste em PascalCase. Para Command/Query
          é o nome da ação (CriarDespesa, Login, ListarLogs); para
          behavior/service/helper é o nome da classe (AuditBehavior,
          JwtTokenService, PasswordHelper); para meta-tests usar
          'Convencoes'.
      - nome: 'Fact(DisplayName = "...")'
        descricao: >
          Frase Given-When-Then em PT-BR descrevendo o cenário. Ex.:
          "Dado credenciais inválidas, quando login, então retorna 401".
          Aceita variações ("Quando ...", "Deve ...") quando o contexto
          é trivial.
    enforcement: >
      Validado por TodoTeste_TemDisplayNameESolucaoEAcao em
      ConvencoesBlueprintTests. Build/CI reprova qualquer método fora
      do padrão.
    filtros_uteis:
      - 'dotnet test --filter "Trait=Solucao=Services"'
      - 'dotnet test --filter "Trait=Acao=CriarDespesa"'