name: mobile-ios

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/Mobile/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Enviar para TestFlight?'
        required: false
        default: 'false'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (iOS)
        run: dotnet workload install maui-ios

      - name: Import signing certs & provisioning profile
        if: env.IOS_CERT_P12_BASE64 != ''
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_CERT_P12_BASE64" | base64 -d > /tmp/atena.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/atena.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/atena.mobileprovision

      - name: Build IPA (Release)
        run: |
          dotnet publish src/Mobile/Acme.Sistemas.Atena.Mobile/Acme.Sistemas.Atena.Mobile.csproj \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -o ./out-ios

      - uses: actions/upload-artifact@v4
        with:
          name: atena-ios-ipa
          path: ./out-ios/*.ipa
          if-no-files-found: warn

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.publish == 'true' && github.ref == 'refs/heads/develop' && env.APP_STORE_API_KEY_ID != '' }}
        env:
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_API_KEY_ID}.p8
          xcrun altool --upload-app --type ios -f ./out-ios/*.ipa \
            --apiKey "$APP_STORE_API_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"
