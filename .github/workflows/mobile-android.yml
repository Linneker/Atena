name: mobile-android

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/Mobile/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar no Google Play (internal track)?'
        required: false
        default: 'false'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore src/Mobile/Acme.Sistemas.Atena.Mobile/Acme.Sistemas.Atena.Mobile.csproj

      - name: Build AAB (Release, signed)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/atena.keystore
            dotnet publish src/Mobile/Acme.Sistemas.Atena.Mobile/Acme.Sistemas.Atena.Mobile.csproj \
              -f net10.0-android -c Release \
              -p:AndroidPackageFormat=aab \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=/tmp/atena.keystore \
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
              -o ./out-android
          else
            dotnet publish src/Mobile/Acme.Sistemas.Atena.Mobile/Acme.Sistemas.Atena.Mobile.csproj \
              -f net10.0-android -c Release -o ./out-android
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: atena-android-aab
          path: ./out-android/*.aab
          if-no-files-found: warn

      - name: Publish to Play Console (internal)
        if: ${{ github.event.inputs.publish == 'true' && github.ref == 'refs/heads/develop' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.acme.atena.mobile
          releaseFiles: ./out-android/*.aab
          track: internal
          status: completed
