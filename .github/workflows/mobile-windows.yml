name: mobile-windows

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/Mobile/**'
      - '.github/workflows/mobile-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (Windows)
        run: dotnet workload install maui-windows

      - name: Build MSIX (Release)
        run: |
          dotnet publish src/Mobile/Acme.Sistemas.Atena.Mobile/Acme.Sistemas.Atena.Mobile.csproj `
            -f net10.0-windows10.0.19041.0 -c Release `
            -p:RuntimeIdentifier=win10-x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -o ./out-windows
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: atena-windows-msix
          path: ./out-windows/**/*.msix
          if-no-files-found: warn
