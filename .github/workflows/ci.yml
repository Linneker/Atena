name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Atena.sln

      - name: Build
        run: dotnet build Atena.sln --configuration Release --no-restore

      - name: Unit tests (inclui ConvencoesBlueprintTests)
        run: dotnet test test/Unit/Acme.Sistemas.Services.UnitTest/Acme.Sistemas.Services.UnitTest.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Integration tests (HealthCheck + RouteSnapshot — requer Docker)
        run: dotnet test test/Integration/Acme.Sistemas.IntegrationTest/Acme.Sistemas.IntegrationTest.csproj --configuration Release --no-build --logger "console;verbosity=normal"
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
